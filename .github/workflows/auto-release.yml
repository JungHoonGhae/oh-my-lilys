name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'package.json'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Type check
        run: bun run tsc

      - name: Check version changes
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists, skipping"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected: v$VERSION"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.version.outputs.should_publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Install Doppler CLI
        if: steps.version.outputs.should_publish == 'true'
        uses: dopplerhq/cli-action@v3

      - name: Fetch NPM token
        if: steps.version.outputs.should_publish == 'true'
        id: doppler
        run: |
          TOKEN=$(doppler secrets get NPM_TOKEN --plain)
          echo "::add-mask::$TOKEN"
          echo "NPM_TOKEN=$TOKEN" >> "$GITHUB_OUTPUT"
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Publish to npm
        if: steps.version.outputs.should_publish == 'true'
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ steps.doppler.outputs.NPM_TOKEN }}
          access: public
          tag: latest

      - name: Create GitHub Release
        if: steps.version.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') }}
          generate_release_notes: true
