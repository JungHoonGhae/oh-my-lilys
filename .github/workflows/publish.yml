name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Type check
        run: bun run tsc

      - name: Setup Node (for OIDC-aware npm CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm (OIDC trusted publishing)
        id: npm-publish
        continue-on-error: true
        run: npm publish --access public --tag latest --provenance

      - name: Create GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true

      - name: Check npm publish result
        if: steps.npm-publish.outcome == 'failure'
        run: |
          echo "::warning::npm publish failed — confirm trusted publisher is registered at npmjs.com for oh-my-lilys (workflow: publish.yml)"
