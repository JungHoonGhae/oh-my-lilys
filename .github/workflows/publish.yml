name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Type check
        run: bun run tsc

      - name: Install Doppler CLI
        if: success()
        uses: dopplerhq/cli-action@v3

      - name: Fetch NPM token
        if: success()
        id: doppler
        run: |
          set -euo pipefail
          TOKEN=$(doppler secrets get NPM_TOKEN --plain 2>/dev/null)
          if [ -z "$TOKEN" ]; then
            echo "::error::NPM_TOKEN not found in Doppler"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "NPM_TOKEN=$TOKEN" >> "$GITHUB_OUTPUT"
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Publish to npm
        id: npm-publish
        uses: JS-DevTools/npm-publish@v3
        continue-on-error: true
        with:
          token: ${{ steps.doppler.outputs.NPM_TOKEN }}
          access: public
          tag: latest

      - name: Create GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true

      - name: Check npm publish result
        if: steps.npm-publish.outcome == 'failure'
        run: |
          echo "::warning::npm publish failed - check NPM_TOKEN secret"
